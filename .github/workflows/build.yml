name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Windows — produces SpeedEditorCustomizer-Windows.zip
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .build-venv
          ./.build-venv/Scripts/python.exe -m pip install -r requirements-build.txt
          "$PWD\.build-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test configuration storage and recovery
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python -m PyInstaller build.spec --clean

      - name: Scan bundle with Defender when the runner provides it
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status -and $status.AntivirusEnabled -and $status.AMServiceEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist\SpeedEditorCustomizer" -ErrorAction Stop
            $detections = Get-MpThreatDetection | Where-Object { ($_.Resources -join ' ') -match 'SpeedEditorCustomizer' }
            if ($detections) { $detections | Format-List; throw 'Defender detected a threat in the build.' }
            Write-Output 'DEFENDER_SCAN_RESULT=completed; no bundle detections reported'
          } else {
            Write-Output 'DEFENDER_SCAN_RESULT=unavailable on this runner; no antivirus clearance claimed'
          }

      - name: Smoke-test packaged GUI without a controller
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath "$PWD\dist\SpeedEditorCustomizer\SpeedEditorCustomizer.exe" -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) {
            $app.Kill()
            throw 'Packaged GUI did not exit within 60 seconds.'
          }
          $app.Refresh()
          if ($app.ExitCode -ne 0) { throw "Packaged GUI failed with exit code $($app.ExitCode)" }

      - name: Record bundled dependencies
        run: python -m pip freeze > dist/SpeedEditorCustomizer/build-dependencies.txt

      - name: Zip build
        run: cd dist && Compress-Archive -Path SpeedEditorCustomizer -DestinationPath SpeedEditorCustomizer-Windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedEditorCustomizer-Windows
          path: dist/SpeedEditorCustomizer-Windows.zip
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS Apple Silicon — arm64, native on M1/M2/M3 Macs
  # ---------------------------------------------------------------------------
  build-macos-arm64:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PyQt6 hidapi pynput obsws-python screen-brightness-control pyinstaller pyinstaller-hooks-contrib

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: python -m PyInstaller build.spec --clean

      - name: Sign .app bundle (ad-hoc, ordered)
        run: |
          APP=dist/SpeedEditorCustomizer.app
          # Sign inner binaries first (order matters — --deep gets it wrong)
          find "$APP" -name "*.dylib" | xargs -I{} codesign --sign - --force --timestamp=none {}
          find "$APP" -name "*.so"    | xargs -I{} codesign --sign - --force --timestamp=none {}
          # Sign the main executable
          codesign --sign - --force --timestamp=none "$APP/Contents/MacOS/SpeedEditorCustomizer"
          # Sign the bundle last
          codesign --sign - --force --timestamp=none "$APP"

      - name: Zip .app bundle
        run: cd dist && zip -r SpeedEditorCustomizer-macOS-AppleSilicon.zip SpeedEditorCustomizer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedEditorCustomizer-macOS-AppleSilicon
          path: dist/SpeedEditorCustomizer-macOS-AppleSilicon.zip

  # ---------------------------------------------------------------------------
  # macOS Intel — x86_64, built via Rosetta 2 on the arm64 runner
  # ---------------------------------------------------------------------------
  build-macos-intel:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install universal2 Python 3.12 (for x86_64 slice)
        run: |
          curl -fsSL -o /tmp/python312.pkg \
            "https://www.python.org/ftp/python/3.12.9/python-3.12.9-macos11.pkg"
          sudo installer -pkg /tmp/python312.pkg -target /

      - name: Install dependencies (x86_64 via Rosetta 2)
        run: |
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m pip install \
            PyQt6 hidapi pynput obsws-python screen-brightness-control pyinstaller pyinstaller-hooks-contrib

      - name: Build (x86_64 / Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m PyInstaller build.spec --clean

      - name: Sign .app bundle (ad-hoc, ordered)
        run: |
          APP=dist/SpeedEditorCustomizer.app
          # Sign inner binaries first (order matters — --deep gets it wrong)
          find "$APP" -name "*.dylib" | xargs -I{} codesign --sign - --force --timestamp=none {}
          find "$APP" -name "*.so"    | xargs -I{} codesign --sign - --force --timestamp=none {}
          # Sign the main executable
          codesign --sign - --force --timestamp=none "$APP/Contents/MacOS/SpeedEditorCustomizer"
          # Sign the bundle last
          codesign --sign - --force --timestamp=none "$APP"

      - name: Zip .app bundle
        run: cd dist && zip -r SpeedEditorCustomizer-macOS-Intel.zip SpeedEditorCustomizer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedEditorCustomizer-macOS-Intel
          path: dist/SpeedEditorCustomizer-macOS-Intel.zip

  # ---------------------------------------------------------------------------
  # Release — runs after all three builds, publishes to "Latest" release
  # ---------------------------------------------------------------------------
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-macos-arm64, build-macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Apple Silicon build
        uses: actions/download-artifact@v4
        with:
          name: SpeedEditorCustomizer-macOS-AppleSilicon
          path: artifacts/

      - name: Download macOS Intel build
        uses: actions/download-artifact@v4
        with:
          name: SpeedEditorCustomizer-macOS-Intel
          path: artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: Automatically built from the latest commit on main.
          prerelease: false
          make_latest: true
          files: |
            artifacts/SpeedEditorCustomizer-macOS-AppleSilicon.zip
            artifacts/SpeedEditorCustomizer-macOS-Intel.zip

  release-windows:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpeedEditorCustomizer-Windows
          path: artifacts/
      - name: Publish Windows download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          target_commitish: ${{ github.sha }}
          name: Latest Windows Build
          body: |
            Windows GUI built from commit ${{ github.sha }}.
            Download the ZIP, extract the entire folder, and open SpeedEditorCustomizer.exe.
            An optional desktop shortcut creator is included.
          make_latest: true
          files: artifacts/SpeedEditorCustomizer-Windows.zip
          fail_on_unmatched_files: true
